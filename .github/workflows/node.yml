name: node

on: push

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Use Node.js 24.x
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: npm
      - name: install
        run: npm install
      - name: build
        run: npm run build
      - name: test
        run: npm test
